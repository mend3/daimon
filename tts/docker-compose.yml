# Local text-to-speech for Ella's voice replies. Kokoro-FastAPI exposes an
# OpenAI-compatible /v1/audio/speech endpoint, so Hermes' `openai` TTS provider
# points at it via base_url — no cloud, no API key, nothing leaves the host.
# Published on loopback only; the devcontainer reaches it at
# host.docker.internal:8880. CPU image (Docker on macOS has no Metal); Kokoro is
# small (~82M params) so short replies synthesize fast enough.
name: hermes-tts

services:
  tts:
    # Pin by digest after the first pull (see scripts/setup-tts-host.sh), matching
    # the project's image-pinning convention.
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    container_name: hermes-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - tts-models:/app/models
    networks:
      - hermes-shared
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8880/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  tts-models:

networks:
  hermes-shared:
    name: hermes-shared
