# Hermes profile: openai — kanban task agents that run on the OpenAI API instead of
# the local Ollama model. Assign a task to assignee "openai" and the dispatcher
# spawns it here; the default profile stays fully local/offline.
# Synced into ~/.hermes/profiles/openai/config.yaml by .devcontainer/postCreate.sh.

# --- Model -------------------------------------------------------------------
# Provider id is `openai-api` (Hermes' OpenAI provider; `openai` is not a valid id).
# This provider reads the key and endpoint from the OPENAI_API_KEY / OPENAI_BASE_URL
# *environment*, NOT from the fields below — and the container sets both to the local
# Ollama. postCreate therefore writes the real values into this profile's own .env
# (which loads with precedence). The fields below are kept for documentation only.
# gpt-5.5 is a reasoning model: the provider uses the Responses API with encrypted
# reasoning content, which only reasoning models accept (gpt-4.x would 400). Swap
# `default` for another reasoning model your key can reach (gpt-5, gpt-5-mini, o4-mini).
model:
  default: "gpt-5.5"
  provider: openai-api
  base_url: "https://api.openai.com/v1"
  api_key: "${OPENAI_PROFILE_API_KEY}"
  context_length: 128000

# --- Execution backend -------------------------------------------------------
terminal:
  backend: local

# --- Agent behavior ----------------------------------------------------------
agent:
  max_turns: 60
  api_max_retries: 3
  tool_use_enforcement: "auto"
  disabled_toolsets:
    - clarify

# --- Auxiliary models --------------------------------------------------------
# Vision stays on the local Ollama (reached via the host); text helpers reuse the
# profile's main model (OpenAI).
auxiliary:
  compression:
    provider: "main"
    model: ""
  vision:
    provider: custom
    model: "qwen2.5vl:7b"
    base_url: "http://host.docker.internal:11434/v1"
    api_key: "ollama"
    timeout: 180
  web_extract:
    provider: "main"
    model: ""

# --- Safety / approvals ------------------------------------------------------
# Dispatched tasks run headless — no one to answer prompts — so skip approvals.
# Tirith command scanning stays on and fail-closed as the safety net.
approvals:
  mode: "off"

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: false

# --- Web search + knowledge base ---------------------------------------------
web:
  backend: searxng

mcp_servers:
  ella-kb:
    command: "/home/vscode/.hermes/ella-kb-mcp.sh"
    args: []

# --- Memory ------------------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true

display:
  streaming: false
  show_reasoning: false
  language: en

timezone: "UTC"
