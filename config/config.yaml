# Hermes Agent — default profile: OpenAI gpt-5-mini primary, local Ollama fallback.
# The `ollama` (local) and `claude-max` (subscription) profiles live in config/profiles/.
# Synced into ~/.hermes/config.yaml by .devcontainer/postCreate.sh.
# Docs: https://hermes-agent.nousresearch.com/docs/user-guide/configuration

# --- Model -------------------------------------------------------------------
# Default: OpenAI gpt-5-mini (a reasoning model, picked for cost/quality) via the
# openai-api provider, which uses the Responses API — so the model must be a reasoning
# model (gpt-5.x/o-series); gpt-4.x would 400 on encrypted reasoning content. This
# provider reads the key and endpoint from the
# OPENAI_API_KEY / OPENAI_BASE_URL *environment*, not the fields below; postCreate
# writes the real values into ~/.hermes/.env from OPENAI_PROFILE_API_KEY. Ollama
# stays the vision/embedding backend (see auxiliary + daimon_kb). Switch the main
# model via `hermes model` or by editing this block:
#   - Local/offline: provider custom, model gpt-oss:20b, base_url the shared Ollama
#     (http://ollama:11434/v1), api_key "ollama", context_length 65536.
#   - Your Claude subscription: provider anthropic, model claude-sonnet-4-5 — needs a
#     Claude Max plan with extra usage credits (the credential is in `hermes auth`).
model:
  default: "gpt-5-mini"
  provider: openai-api
  base_url: "https://api.openai.com/v1"
  api_key: "${OPENAI_PROFILE_API_KEY}"
  context_length: 128000

# Auto-fallback to the local Ollama when OpenAI errors out (429/5xx/401/404 or
# empty responses) — keeps the agent answering offline/over outages. Turn-scoped:
# each new message retries the primary first. The entry is self-contained.
fallback_providers:
  - provider: custom
    model: gpt-oss:20b
    base_url: "http://ollama:11434/v1"
    api_key: "ollama"

# `custom` here is the local Ollama (fallback + the qwen vision aux). Generous
# timeouts: local inference streams slower than a hosted API, and the first request
# pays the model load-into-VRAM cost.
providers:
  custom:
    request_timeout_seconds: 1800
    stale_timeout_seconds: 600
    models:
      "gpt-oss:20b":
        timeout_seconds: 1200

# --- Execution backend -------------------------------------------------------
# The devcontainer IS the sandbox, so run tools locally inside it (no nested
# Docker). The host filesystem is never exposed to the agent.
terminal:
  backend: local

# --- Agent behavior ----------------------------------------------------------
agent:
  max_turns: 60                # iteration budget per conversation
  api_max_retries: 3
  reasoning_effort: "medium"   # gpt-oss reasoning effort; medium balances speed/quality
  tool_use_enforcement: "auto"
  # Clarify off: gpt-oss misspells the tool name ("clearify" → harmony parser
  # warning) and its numbered-button UI reads poorly. The agent asks follow-up
  # questions in prose instead, describing the options.
  disabled_toolsets:
    - clarify

# --- Auxiliary models --------------------------------------------------------
# Text helpers reuse the primary model ("main"). Vision needs a multimodal model,
# so it points at qwen2.5vl on the same local Ollama endpoint.
auxiliary:
  compression:
    provider: "main"
    model: ""
  vision:
    provider: custom
    model: "qwen2.5vl:7b"
    base_url: "http://ollama:11434/v1"
    api_key: "ollama"
    timeout: 180
  web_extract:
    provider: "main"
    model: ""
  # The memory curator's model (see `curator` below). Runs weekly, so the main model
  # (quality decisions) over the local one is a negligible cost.
  curator:
    provider: "main"
    model: ""

# --- Context management ------------------------------------------------------
# Local models have a smaller usable context window than frontier APIs; compress
# earlier (at ~32K of the 64K window) and keep a tighter recent tail.
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 16
  protect_first_n: 3

# --- Memory ------------------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true

# Automatic memory hygiene — Daimon's SOUL says "save what's durable, not passing
# chatter", and the curator enforces it: weekly, when idle, it archives stale
# memories and prunes noise (backups kept, so it's reversible).
curator:
  enabled: true
  interval_hours: 168       # weekly
  min_idle_hours: 2         # only when the user has been quiet a while
  stale_after_days: 30
  archive_after_days: 90
  prune_builtins: true
  backup:
    enabled: true
    keep: 5

# --- Safety / approvals ------------------------------------------------------
# Manual approval for actions; secret redaction and command scanning on.
approvals:
  mode: manual

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: false   # fail closed: if the command scanner errors, block the
                            # action rather than run it unscanned (agent has shell)

# --- Web search --------------------------------------------------------------
# Local SearXNG (private, keyless) — a Daimon sidecar on the shared network, started by
# `make searxng`; SEARXNG_URL is set in .env.
web:
  backend: searxng

# --- Knowledge base (MCP) ----------------------------------------------------
# Daimon's personal RAG store: capture/recall/forget over a local Qdrant. The
# launcher loads ~/.hermes/.env (for QDRANT_API_KEY) then runs the server in the
# Hermes venv where the daimon_kb package is installed (see postCreate.sh).
mcp_servers:
  daimon-kb:
    command: "/home/vscode/.hermes/daimon-kb-mcp.sh"
    args: []

# --- Voice (text-to-speech) --------------------------------------------------
# Local, OpenAI-compatible TTS (Kokoro-FastAPI), a Daimon sidecar on the shared network.
# Using the `openai` provider with a base_url override keeps voice replies fully local
# (the default `edge` provider would send text to Microsoft). The api_key is required
# by the client but ignored by the local server.
tts:
  provider: openai
  openai:
    base_url: "http://daimon-tts:8880/v1"
    api_key: "local"
    model: "kokoro"
    voice: "af_sky"

# --- Voice in (speech-to-text) -----------------------------------------------
# Transcribe Telegram/web voice messages locally with faster-whisper (installed by
# postCreate). `base` balances speed/accuracy on CPU; bump to `small` for accuracy.
stt:
  provider: "local"
  local:
    model: "base"

# --- Messaging gateway -------------------------------------------------------
# Silently ignore DMs from users not on the Telegram allowlist (no pairing prompt) —
# the agent has shell/file tools, so unknown senders get nothing.
unauthorized_dm_behavior: ignore

# Natural pacing on messaging platforms — Daimon reads as "genuinely human" rather than
# firing replies back instantly.
human_delay:
  mode: natural

# Zero-token chat shortcuts (no LLM). /health pings the services Daimon relies on,
# by DNS on the shared network.
quick_commands:
  health:
    type: exec
    command: 'for hp in "Ollama ollama:11434" "Qdrant qdrant:6333" "SearXNG daimon-searxng:8080" "TTS daimon-tts:8880"; do set -- $hp; c=$(curl -s -o /dev/null -m3 -w "%{http_code}" "http://$2" 2>/dev/null); [ "$c" != "000" ] && echo "OK  $1" || echo "DOWN $1"; done'

# --- Display -----------------------------------------------------------------
display:
  streaming: true
  show_reasoning: false
  tool_progress: all
  language: en

# Set your IANA timezone so timestamps/cron match local time (e.g. Europe/Berlin).
timezone: "UTC"
