# Ella's knowledge-base configuration. Synced into ~/.hermes/ella_kb.yaml by
# postCreate.sh and read by the ella-kb MCP server and the `ella-kb` CLI.
#
# `capabilities` is the only switch that turns a source type on. Each enabled type
# gets its own Qdrant collection (kb_<type>__nomic768). Secrets come from
# ~/.hermes/.env via ${VAR} expansion — never hard-code them here.
ella_kb:
  ledger_path: "~/.hermes/ella_kb/ledger.db"

  qdrant:
    url: "http://host.docker.internal:6333"
    api_key: "${QDRANT_API_KEY}"

  embeddings:
    base_url: "http://host.docker.internal:11434"
    model: "nomic-embed-text"
    tag: "nomic"
    dim: 768

  retrieval:
    top_k_per_collection: 20
    final_k: 8
    score_threshold: 0.55
    max_per_source: 3

  security:
    redact_secrets: true
    allow_private_networks: false

  # Each enabled source type becomes its own Qdrant collection. Adding a new type
  # is an adapter drop-in (see ingestion/README.md) — this list is the only switch.
  capabilities:
    files:
      enabled: true
      settings:
        roots: ["~/kb"]
    urls:
      enabled: true
    chat:
      enabled: true

    # Feeds connector (Miniflux). The web Feeds module processes items with AI and
    # ingests them here; enabling makes them part of recall and the knowledge graph.
    # Needs scripts/setup-miniflux-host.sh + MINIFLUX_* in ~/.hermes/.env.
    feeds:
      enabled: false
      settings:
        batch_limit: 50

    # Example connector: inbound webhook (push). Enable, set KB_WEBHOOK_SECRET in
    # ~/.hermes/.env, and run `ella-kb webhook-serve`.
    webhook:
      enabled: false
