# Vector store for Ella's knowledge base. One collection per enabled source type
# (files, urls, feeds, webhook, chat). Published on loopback only; the devcontainer
# reaches it at host.docker.internal:6333. API-key protected (Qdrant has no auth by
# default) — key in qdrant/.env (gitignored), generated by scripts/setup-qdrant-host.sh.
name: hermes-qdrant

services:
  qdrant:
    # Pin by digest after the first pull, matching the project's pinning convention.
    image: qdrant/qdrant:v1.12.4
    container_name: hermes-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
      QDRANT__LOG_LEVEL: "WARN"
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - hermes-shared

volumes:
  qdrant-data:

networks:
  hermes-shared:
    name: hermes-shared
