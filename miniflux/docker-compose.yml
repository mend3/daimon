# Miniflux: a feed reader that polls RSS/Atom. It's one example ingestion source
# for Ella's knowledge base (the `feeds` adapter) — plug-and-play, not core.
# Miniflux only fetches feeds; Ella triages and ingests. Published on loopback;
# the devcontainer reaches the API at host.docker.internal:8930. Creds in
# miniflux/.env (gitignored), generated by scripts/setup-miniflux-host.sh.
name: hermes-miniflux

services:
  db:
    image: postgres:17-alpine
    container_name: hermes-miniflux-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: miniflux
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    networks:
      - hermes-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  miniflux:
    image: miniflux/miniflux:2.2.3
    container_name: hermes-miniflux
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/miniflux?sslmode=disable"
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: "${MINIFLUX_ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${MINIFLUX_ADMIN_PASSWORD}"
      BASE_URL: "http://localhost:8930/"
    ports:
      - "127.0.0.1:8930:8080"
    networks:
      - hermes-shared
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  miniflux-db:

networks:
  hermes-shared:
    name: hermes-shared
