apiVersion: 1
groups:
  - orgId: 1
    name: hermes-alerts
    folder: Hermes
    interval: 1m
    rules:
      - uid: ollama-down
        title: Ollama unreachable
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Ollama did not answer the HTTP probe for 1 min — local inference is down."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min(probe_success{service="ollama"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
