server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Hermes agent + gateway logs, read from the hermes-data volume.
  - job_name: hermes
    static_configs:
      - targets: [localhost]
        labels:
          source: hermes
          __path__: /hermes/logs/*.log
    pipeline_stages:
      - match:
          selector: '{source="hermes"}'
          stages:
            - regex:
                expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+ (?P<level>\w+) (?P<component>[\w.]+):'
            - labels:
                level:
                component:

  # Host Ollama request/load log (written to ~/.hermes-monitoring/ollama.log).
  - job_name: ollama
    static_configs:
      - targets: [localhost]
        labels:
          source: ollama
          __path__: /host-logs/ollama.log
