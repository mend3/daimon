# Ella's web canvas + chat, built and served as one host container (no local npm
# needed). Published on loopback; reaches Ollama/Qdrant via host.docker.internal.
# Mounts the hermes-data volume so it shares Ella's SOUL, config, secrets, and the
# knowledge ledger — so run the devcontainer once first to populate it.
name: hermes-web

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: hermes-web
    restart: unless-stopped
    # Run as the same uid as the devcontainer (vscode=1000) with a matching home, so
    # files created in the shared hermes-data volume stay owned by that user.
    user: "1000:1000"
    environment:
      HOME: /home/vscode
      # Keep model/cache downloads inside the writable volume (the container home
      # outside it is root-owned), and skip the Xet backend which ignores cache_dir.
      HF_HOME: /home/vscode/.hermes/cache/hf
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "127.0.0.1:8099:8099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hermes-data:/home/vscode/.hermes
    networks:
      - hermes-shared
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8099/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  hermes-shared:
    name: hermes-shared

volumes:
  hermes-data:
    external: true
