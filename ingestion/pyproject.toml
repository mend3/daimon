[project]
name = "daimon_kb"
version = "0.1.0"
description = "Daimon's personal RAG knowledge base: pluggable source adapters over a Qdrant vector store."
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12,<1.13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "trafilatura>=1.12",
    "pypdf>=4.2",
]

[project.optional-dependencies]
feeds = ["feedparser>=6.0"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
daimon-kb = "daimon_kb.cli:main"

# Out-of-tree adapters register here; `pip install <pkg>` then enable in config.
[project.entry-points."daimon_kb.adapters"]

# Out-of-tree workflow node types register here.
[project.entry-points."daimon_flow.nodes"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["daimon_kb*", "daimon_flow*"]
