# Local SearXNG metasearch for Hermes' web toolset. Runs on the host; the
# devcontainer reaches it at host.docker.internal:8888. Valkey backs SearXNG's
# cache and rate limiter (the official topology) — without it SearXNG logs
# SQLite cache errors.
services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: hermes-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data

  searxng:
    image: searxng/searxng:latest
    container_name: hermes-searxng
    restart: unless-stopped
    depends_on: [valkey]
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/

volumes:
  valkey-data:
