# Local SearXNG metasearch for Hermes' web toolset. Runs on the host; the
# devcontainer reaches it at host.docker.internal:8888. Cache/limiter use the
# shared Redis (redis/) over the hermes-shared network — run scripts/setup-redis-host.sh
# first.
services:
  searxng:
    image: searxng/searxng:latest@sha256:1081d08bdcd6126533de497ee597f64de94064339e7bc03bc046352adfe320e6
    container_name: hermes-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    networks:
      - hermes-shared
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  hermes-shared:
    name: hermes-shared
    external: true
