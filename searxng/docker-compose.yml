# Local SearXNG metasearch for Hermes' web toolset. Runs on the host; the
# devcontainer reaches it at host.docker.internal:8888.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: hermes-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
