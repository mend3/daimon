# Daimon, consolidated: the container Hermes runs in plus his sidecars. Shared infra
# (redis/qdrant/ollama + observability) is provided by your own stack on an external
# Docker network — set SHARED_NETWORK to its name (default `shared`) and start that
# stack first; Daimon declares none of it.
#
# Profiles group the services so subsets can be started independently (mirrors the
# Makefile targets):
#   - agent, searxng, tts: Daimon himself + his sidecars (profile `core`); `make up`.
#   - chat-shipper, status-exporter: app-level telemetry (profile `monitoring`).
#
# Services carry a `daimon-` alias on the shared network so their generic names stay
# collision-free next to other stacks; `container_name` keeps the `hermes-` prefix.
name: daimon

services:
  # Hermes itself: an isolated container, not a devcontainer — the same image and
  # scripts, brought up by compose alongside everything else it talks to. The
  # container IS the sandbox (config.yaml runs tools with terminal backend `local`),
  # so nothing here is reachable from the host filesystem except the repo mount.
  agent:
    build: docker/agent
    container_name: hermes-agent
    restart: unless-stopped
    profiles: [core]
    # His sidecars come up with him — starting the agent alone would leave web search
    # and voice quietly missing. `service_started`, not `service_healthy`: he reaches
    # both by DNS at call time, not at boot, so waiting on TTS (whose first start
    # downloads a voice model) would delay every start to buy nothing.
    depends_on:
      searxng:
        condition: service_started
      tts:
        condition: service_started
    volumes:
      # The repo: config/, skills/ and ingestion/ are synced or installed from it on
      # every start, so edits land with a `docker compose restart agent`.
      - ./:/workspace
      # ~/.hermes holds config/memories/sessions/agent code; ~/.local holds the
      # uv-managed Python runtime and launcher the venv links to — without it, every
      # rebuild reinstalls Hermes from scratch.
      - hermes-data:/home/vscode/.hermes
      - hermes-local:/home/vscode/.local
    environment:
      # Point Hermes' OpenAI-compatible client at the shared Ollama. Also set in
      # config.yaml; kept here so any env-driven code path agrees.
      OPENAI_BASE_URL: http://ollama:11434/v1
      OPENAI_API_KEY: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      # Optional, for the OpenAI fallback: set it in this repo's .env (compose reads
      # that file) and setup.sh writes it into ~/.hermes/.env, where the provider
      # picks it up. Unset means local-only, which is a supported way to run.
      OPENAI_PROFILE_API_KEY: ${OPENAI_PROFILE_API_KEY:-}
    ports:
      # The web dashboard, started on demand with `hermes dashboard --port 8090` — the
      # devcontainer used to forward it. Loopback only: it serves sessions, config and
      # the kanban with no auth of its own.
      - "127.0.0.1:8090:8090"
    extra_hosts:
      # Keeps anything published on the host reachable, as under the devcontainer.
      - "host.docker.internal:host-gateway"
    networks:
      default:
      shared:
        aliases: [daimon-agent]

  searxng:
    image: searxng/searxng:latest@sha256:1081d08bdcd6126533de497ee597f64de94064339e7bc03bc046352adfe320e6
    container_name: hermes-searxng
    restart: unless-stopped
    profiles: [core]
    ports:
      - "8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    networks:
      default:
      shared:
        aliases: [daimon-searxng]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  tts:
    # Pin by digest after the first pull (see scripts/setup-tts-host.sh), matching
    # the project's image-pinning convention.
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    container_name: hermes-tts
    restart: unless-stopped
    profiles: [core]
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - tts-models:/app/models
    networks:
      default:
      shared:
        aliases: [daimon-tts]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8880/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # App-level telemetry sidecar: ships real conversation text from Hermes' state.db
  # to the shared Loki (DNS `loki:3100`) for the Grafana chat panel.
  chat-shipper:
    image: python@sha256:236173eb74001afe2f60862de935b74fcbd00adfca247b2c27051a70a6a39a2d
    container_name: hermes-chat-shipper
    restart: unless-stopped
    profiles: [monitoring]
    command: ["python3", "/app/ship.py"]
    environment:
      LOKI_URL: "http://loki:3100/loki/api/v1/push"
    volumes:
      - ./docker/chat-shipper/ship.py:/app/ship.py:ro
      - hermes-data:/hermes:ro
      - chat-shipper-state:/state
    networks: [shared]

  # App-level telemetry sidecar: exposes Hermes' gateway status (`hermes_gateway_up`,
  # read from agent.log) at `daimon-status-exporter:9101/metrics` for the shared Prometheus.
  status-exporter:
    image: python@sha256:236173eb74001afe2f60862de935b74fcbd00adfca247b2c27051a70a6a39a2d
    container_name: hermes-status-exporter
    restart: unless-stopped
    profiles: [monitoring]
    command: ["python3", "/app/exporter.py"]
    volumes:
      - ./docker/status-exporter/exporter.py:/app/exporter.py:ro
      - hermes-data:/hermes:ro
    networks:
      shared:
        aliases: [daimon-status-exporter]

volumes:
  tts-models:
  chat-shipper-state:
  # Hermes' home and toolchain. External — and so unprefixed — because the
  # devcontainer mounts the same two volumes by name: whichever way you bring Hermes
  # up, it is the same agent, with the same memories and sessions. `make up` creates
  # them if missing.
  hermes-data:
    external: true
  hermes-local:
    external: true

networks:
  default:
  shared:
    name: ${SHARED_NETWORK:-shared}
    external: true
