# General-purpose Redis for current and future containers. Password-protected and
# published on loopback only (no LAN exposure). Other containers reach it on the
# shared `hermes-shared` network as redis:6379; host tools use 127.0.0.1:6379.
# (SearXNG keeps its own Valkey — this is a separate, reusable instance.)
#
# Password is read from redis/.env (gitignored), generated by
# scripts/setup-redis-host.sh.
name: hermes-redis

services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: hermes-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hermes-shared
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

networks:
  hermes-shared:
    name: hermes-shared
