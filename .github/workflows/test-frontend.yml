name: test-frontend

# Run only when the web frontend or this workflow change.
on:
  push:
    branches: [main]
    paths: &paths
      - 'web/frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    paths: *paths

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - run: npm ci
      - run: npm run build
