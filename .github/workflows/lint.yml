name: lint

# Only run when files this workflow actually checks change.
on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.yamllint'
      - 'monitoring/grafana/dashboards/*.json'
  pull_request:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.yamllint'
      - 'monitoring/grafana/dashboards/*.json'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck --severity=warning $(git ls-files '*.sh')

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint .

      - name: Validate dashboard JSON
        run: python3 -c "import json; json.load(open('monitoring/grafana/dashboards/hermes.json'))"
