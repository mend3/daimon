name: test-python

# Run only when the Python packages or this workflow change.
on:
  push:
    branches: [main]
    paths: &paths
      - 'ingestion/**'
      - '.github/workflows/test-python.yml'
  pull_request:
    paths: *paths

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + test deps
        run: pip install -e './ingestion[dev,mcp,feeds]'

      # Integration tests gate on DAIMON_KB_IT=1 (live Ollama/Qdrant), so this runs
      # the unit suite and skips them.
      - name: pytest
        run: pytest ingestion/tests
